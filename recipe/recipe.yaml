context:
  version: "1.0.1"
  tag: ${{ version | replace("beta", "-beta") }}

package:
  name: rustfs
  version: ${{ version }}

source:
  url: https://github.com/rustfs/rustfs/archive/refs/tags/${{ tag }}.tar.gz
  sha256: 612ae16743723de917d9c8aadfe06aac8516bd9cc2f648d2679128561cb1fe28

build:
  number: 0
  # Currently don't ship the web console because `rustfs/static` is empty at build time.
  script:
    # `--ignore-rust-version`: upstream sets `rust-version` to whatever the
    # current stable release is (1.97.1 in 1.0.0-beta.12, 1.98.1 in 1.0.0)
    # rather than to a tested minimum, and conda-forge's `rust` activation
    # packages lag a release behind. The sources build fine on 1.97.1.
    env:
      # Upstream's release profile asks for `lto = "thin"` with
      # `codegen-units = 1`. Both are too memory-hungry for the 4-core/16 GB
      # linux-aarch64 runner, where rustc gets OOM-killed ("rustc was
      # terminated by a deadly signal") — with thin LTO while linking the two
      # ~200 MB binaries (`rustfs` and `rustfs-cli`, the latter new in 1.0.0)
      # in parallel, and with one codegen unit while compiling large crates
      # such as `rustfs-ecstore`. Drop LTO and use cargo's stock release
      # `codegen-units`, which splits codegen into smaller units.
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_STRIP: symbols
    content:
      - if: unix
        then:
          - cargo auditable install --locked --no-track --bins --ignore-rust-version --root ${{ PREFIX }} --path ./rustfs
        else:
          # The env vars below are only correct on Windows, so they are exported
          # here instead of in `script.env` (which applies to every platform).
          #
          # aws-lc-sys' default build path emits x86_64 objects when
          # cross-compiling win-64 -> win-arm64:
          #   fatal error LNK1112: module machine type 'x64' conflicts with
          #   target machine type 'ARM64'
          # Its CMake builder honours the target architecture instead.
          - set "AWS_LC_SYS_CMAKE_BUILDER=1"
          # Link the host zstd rather than zstd-sys' vendored copy, which does
          # not survive the cross-compile:
          #   error LNK2019: unresolved external symbol ZSTD_compressStream
          # `pkg-config` refuses to run for a foreign target unless cross
          # lookups are opted into. No PKG_CONFIG_SYSROOT_DIR: conda's .pc
          # files already carry the relocated host prefix, so prepending a
          # sysroot would break the paths they contain.
          - set "ZSTD_SYS_USE_PKG_CONFIG=1"
          - set "PKG_CONFIG_ALLOW_CROSS=1"
          - set "PKG_CONFIG_PATH=%LIBRARY_PREFIX%\lib\pkgconfig"
          - cargo auditable install --locked --no-track --bins --ignore-rust-version --root %LIBRARY_PREFIX% --path ./rustfs
      - cargo-bundle-licenses --format yaml --output ./THIRDPARTY.yml

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    - cargo-auditable
    - cmake
    - ninja
    - make
    - libprotobuf
    - if: win
      then:
        - pkg-config
  host:
    - if: win
      then:
        - zstd

tests:
  - script:
      - rustfs --help
      - rustfs-cli --help
  - package_contents:
      bin:
        - rustfs
        # New in 1.0.0.
        - rustfs-cli
      strict: true

about:
  homepage: https://rustfs.com
  summary: High-performance distributed S3-compatible object storage written in Rust
  description: |
    RustFS is an open-source, S3-compatible high-performance object storage
    system built in Rust. It supports erasure coding, identity and access
    management, policy management, S3 Select, and migration and coexistence
    with other S3-compatible platforms such as MinIO and Ceph.
  license: Apache-2.0
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  documentation: https://docs.rustfs.com/
  repository: https://github.com/rustfs/rustfs

extra:
  recipe-maintainers:
    - pavelzw
